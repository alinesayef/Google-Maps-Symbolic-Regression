
name: Python Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pylint:
    name: Pylint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pylint
        run: python -m pip install pylint

      - name: Run Pylint
        run: pylint --fail-under=8.0 $(git ls-files '*.py')
